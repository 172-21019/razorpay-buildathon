<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
  </marker>
</defs>

<rect width="1200" height="470" fill="#fff"/>

<g font-family="Arial, sans-serif" text-anchor="middle">

  <text x="600" y="42" font-size="28" font-weight="700">
    End-to-End Demo Flow
  </text>

  <!-- ARROWS -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">

    <!-- Top row: left → right -->
    <path d="M210 145 L285 145"/>
    <path d="M455 145 L530 145"/>
    <path d="M700 145 L775 145"/>
    <path d="M945 145 L1020 145"/>

    <!-- 5. Cart → 6. Checkout -->
    <path d="M1110 180 L1110 280"/>

    <!-- Bottom row: right → left -->
    <path d="M1025 315 L945 315"/>
    <path d="M775 315 L700 315"/>
    <path d="M530 315 L455 315"/>
    <path d="M285 315 L210 315"/>

  </g>

  <!-- BOXES -->

  <!-- 1 -->
  <rect x="40" y="110" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="125" y="140" font-size="15" font-weight="700">1. User request</text>
  <text x="125" y="162" font-size="12">“headphones under ₹5000”</text>

  <!-- 2 -->
  <rect x="285" y="110" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="370" y="140" font-size="15" font-weight="700">2. Gemini</text>
  <text x="370" y="162" font-size="12">Intent: product + budget</text>

  <!-- 3 -->
  <rect x="530" y="110" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="615" y="140" font-size="15" font-weight="700">3. Backend</text>
  <text x="615" y="162" font-size="12">Search + filter + rank</text>

  <!-- 4 -->
  <rect x="775" y="110" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="860" y="140" font-size="15" font-weight="700">4. AI Pick</text>
  <text x="860" y="162" font-size="12">Best match + alternatives</text>

  <!-- 5 -->
  <rect x="1025" y="110" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1110" y="140" font-size="15" font-weight="700">5. Cart</text>
  <text x="1110" y="162" font-size="12">Human adds product</text>

  <!-- 6 -->
  <rect x="1025" y="280" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1110" y="310" font-size="15" font-weight="700">6. Checkout</text>
  <text x="1110" y="332" font-size="12">Address + price</text>

  <!-- 7 -->
  <rect x="775" y="280" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="860" y="310" font-size="15" font-weight="700">7. Razorpay</text>
  <text x="860" y="332" font-size="12">Hosted test payment</text>

  <!-- 8 -->
  <rect x="530" y="280" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="615" y="310" font-size="15" font-weight="700">8. Verify</text>
  <text x="615" y="332" font-size="12">Server checks status</text>

  <!-- 9 -->
  <rect x="285" y="280" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="370" y="310" font-size="15" font-weight="700">9. Order</text>
  <text x="370" y="332" font-size="12">Mark paid</text>

  <!-- 10 -->
  <rect x="40" y="280" width="170" height="70" rx="10"
        fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="125" y="310" font-size="15" font-weight="700">10. Audit</text>
  <text x="125" y="332" font-size="12">Lifecycle persisted</text>

</g>
</svg>
